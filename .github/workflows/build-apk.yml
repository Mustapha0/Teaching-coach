name: Build Teaching Coach AI Android APK
on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build web app
        run: npm run build
      - name: Add Android platform
        run: npx cap add android
      - name: Install Vosk Android plugin and bundled small English model
        shell: bash
        run: |
          set -euo pipefail
          PKG_DIR=android/app/src/main/java/com/teachingcoach/ai
          mkdir -p "$PKG_DIR" android/app/src/main/assets
          # Plugin source is embedded here so the build works even if the native/ folder was not uploaded
          echo "" | base64 -d > "$PKG_DIR/VoskSpeechPlugin.java"
          grep -q "class VoskSpeechPlugin" "$PKG_DIR/VoskSpeechPlugin.java"

          # Download and bundle the small offline English model
          curl --fail --location --retry 5 --retry-delay 5 --connect-timeout 30 --output /tmp/vosk-small.zip https://alphacephei.com/vosk/models/vosk-model-small-en-us-0.15.zip
          mkdir -p /tmp/vosk-small
          unzip -q /tmp/vosk-small.zip -d /tmp/vosk-small
          test -d /tmp/vosk-small/vosk-model-small-en-us-0.15/am
          cp -a /tmp/vosk-small/vosk-model-small-en-us-0.15 android/app/src/main/assets/

          # Vosk + JNA dependencies (separate block so it works regardless of build.gradle layout)
          cat >> android/app/build.gradle <<'GRADLE'

          dependencies {
              implementation "com.alphacephei:vosk-android:0.3.47"
              implementation "net.java.dev.jna:jna:5.13.0@aar"
          }
          GRADLE
          # strip the YAML indentation that the heredoc preserved
          sed -i 's/^          //' android/app/build.gradle

          # Microphone permission
          sed -i 's#</manifest>#    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />\n</manifest>#' android/app/src/main/AndroidManifest.xml

          # Replace MainActivity entirely (Capacitor's template is a one-line class body, so sed insertion would break it)
          cat > "$PKG_DIR/MainActivity.java" <<'JAVA'
          package com.teachingcoach.ai;

          import android.os.Bundle;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  registerPlugin(VoskSpeechPlugin.class);
                  super.onCreate(savedInstanceState);
              }
          }
          JAVA
          sed -i 's/^          //' "$PKG_DIR/MainActivity.java"
      - name: Install app launcher icon
        shell: bash
        run: |
          set -euo pipefail
          RES=android/app/src/main/res
          # Remove Capacitor's default adaptive icon so the supplied artwork is used on every Android version
          rm -rf "$RES"/mipmap-anydpi-v26
          echo "" | base64 -d | tar xz -C "$RES"
          test -f "$RES/mipmap-xxxhdpi/ic_launcher.png"
      - name: Sync Capacitor
        run: npx cap sync android
      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Teaching-Coach-AI-offline-vosk-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
